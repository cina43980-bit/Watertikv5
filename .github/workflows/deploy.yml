name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Create config.js from secrets
        run: |
          echo "window.__CONFIG = {" > js/config.js
          echo "  firebase: {" >> js/config.js
          echo "    apiKey: '${{ secrets.FIREBASE_API_KEY }}'," >> js/config.js
          echo "    authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}'," >> js/config.js
          echo "    projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'," >> js/config.js
          echo "    storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}'," >> js/config.js
          echo "    messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}'," >> js/config.js
          echo "    appId: '${{ secrets.FIREBASE_APP_ID }}'" >> js/config.js
          echo "  }," >> js/config.js
          echo "  cerebras: {" >> js/config.js
          echo "    apiKey: '${{ secrets.CEREBRAS_API_KEY }}'," >> js/config.js
          echo "    apiUrl: '${{ secrets.CEREBRAS_API_URL }}'," >> js/config.js
          echo "    model: '${{ secrets.CEREBRAS_MODEL }}'" >> js/config.js
          echo "  }," >> js/config.js
          echo "  tiktok: {" >> js/config.js
          echo "    apiUrl: '${{ secrets.TIKTOK_API_URL }}'" >> js/config.js
          echo "  }" >> js/config.js
          echo "};" >> js/config.js
          echo "Object.freeze(window.__CONFIG);" >> js/config.js
          echo "console.log('✅ Config injected from secrets');" >> js/config.js
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
